{% extends "painel/base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block nav %}{% endblock %}
{% block conteudo %}
<div class="centro">
  <form class="cartao" method="post" action="/painel/entrar">
    <h1 style="margin-top:0">Painel da Diana</h1>
    {% if sem_senha %}<p class="recado recado-aviso">A senha do painel ainda não foi configurada (variável ADMIN_SENHA no Railway).</p>{% endif %}
    <label class="campo">Senha<input class="entrada" type="password" name="senha" autocomplete="current-password" required autofocus></label>
    <button class="botao botao-largo" type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
